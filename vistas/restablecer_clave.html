<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer contraseña - Turnos Ya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f8fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .center-card { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(0, 158, 227, 0.04);
            background-color: #ffffff;
        }
        .logo-small {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #009ee3, #00b4d8);
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 12px 14px;
            font-size: 0.95rem;
            transition: all 0.18s ease;
        }
        .form-control:focus {
            border-color: #009ee3;
            box-shadow: 0 0 0 3px rgba(0, 158, 227, 0.15);
            outline: none;
        }
        .btn-custom {
            background-color: #009ee3;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.18s ease;
        }
        .btn-custom:hover {
            background-color: #0081bb;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .link-custom {
            color: #009ee3;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .link-custom:hover {
            color: #0081bb;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container center-card">
        <div class="card w-100 shadow-sm" style="max-width: 440px;">
            <div class="card-body p-4">
                <a href="./" id="backToHomeLink" style="text-decoration: none; display: inline-block;">
                    <div class="logo-small">TY</div>
                </a>
                <h2 class="card-title fw-bold text-dark mb-1">Nueva contraseña</h2>
                <p class="text-muted mb-4 small" id="introText">Elige una contraseña nueva y segura para tu cuenta.</p>
                
                <form id="resetForm">
                    <div class="mb-3">
                        <label class="form-label">Nueva contraseña</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Confirmar nueva contraseña</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Repite la contraseña" required>
                    </div>
                    <button class="btn btn-custom w-100 mb-3 shadow-sm" type="submit" id="btnSubmit">Guardar contraseña</button>
                </form>
                
                <div id="resetMessage" class="alert d-none py-2 text-center small" role="alert"></div>
                
                <div class="text-center pt-3 border-top mt-3">
                    <a href="login" class="link-custom">Volver al inicio de sesión</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const pageBasePath = (function() {
            try {
                const pathname = window.location.pathname;
                const parts = pathname.split('/');
                const knownPages = ['pagina-inicio','client','crear-negocio','agregar-horario','login','dashboard','registro','api','recuperar-clave','restablecer-clave'];
                while (parts.length > 0) {
                    const last = parts[parts.length - 1];
                    if (last === '' || knownPages.includes(last)) {
                        parts.pop();
                    } else {
                        break;
                    }
                }
                return parts.join('/');
            } catch (e) {
                return '';
            }
        })();
        const apiUrl = pageBasePath + '/api';

        // Redirección automática si el usuario ya está autenticado
        (function() {
            const loggedUserId = localStorage.getItem('userId');
            const loggedUserRole = localStorage.getItem('userRole') || 'client';
            if (loggedUserId) {
                if (loggedUserRole === 'owner' || loggedUserRole === 'administrator' || loggedUserRole === 'staff') {
                    window.location.href = pageBasePath + '/dashboard';
                } else {
                    window.location.href = pageBasePath + '/pagina-inicio';
                }
            }
        })();

        // Corrige los destinos de los enlaces absolutos dinámicamente
        if (pageBasePath) {
            const correctLinks = () => {
                document.querySelectorAll('a').forEach(el => {
                    const href = el.getAttribute('href');
                    if (href && href.startsWith('/') && !href.startsWith('//')) {
                        el.setAttribute('href', pageBasePath + (href === '/' ? '' : href));
                    }
                });
                const backLink = document.getElementById('backToHomeLink');
                if (backLink) {
                    backLink.setAttribute('href', pageBasePath + '/');
                }
            };

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', correctLinks);
            } else {
                correctLinks();
            }
        }

        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        const resetForm = document.getElementById('resetForm');
        const resetMessage = document.getElementById('resetMessage');
        const introText = document.getElementById('introText');
        const btnSubmit = document.getElementById('btnSubmit');

        function showMessage(message, type = 'danger') {
            resetMessage.textContent = message;
            resetMessage.className = `alert alert-${type} py-2 text-center small`;
            resetMessage.classList.remove('d-none');
        }

        if (!token) {
            resetForm.classList.add('d-none');
            introText.classList.add('d-none');
            showMessage('El token de recuperación falta o es inválido.');
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            resetMessage.classList.add('d-none');
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;

            if (password !== confirm_password) {
                showMessage('Las contraseñas ingresadas no coinciden.');
                return;
            }

            if (password.length < 6) {
                showMessage('La nueva contraseña debe tener al menos 6 caracteres.');
                return;
            }

            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Guardando...';

            try {
                const res = await fetch(`${apiUrl}/reset-password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, password })
                });
                const result = await res.json();

                if (res.ok) {
                    showMessage('¡Contraseña restablecida con éxito! Redirigiendo al inicio de sesión...', 'success');
                    resetForm.reset();
                    setTimeout(() => {
                        window.location.href = pageBasePath + '/login';
                    }, 2000);
                } else {
                    showMessage(result.message || 'Ocurrió un error al restablecer la contraseña.');
                    btnSubmit.disabled = false;
                    btnSubmit.textContent = 'Guardar contraseña';
                }
            } catch (error) {
                showMessage('Error de conexión. Por favor intenta nuevamente.');
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Guardar contraseña';
            }
        });
    </script>
</body>
</html>
