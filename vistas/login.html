<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Turnos Ya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f8fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .center-card { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(0, 158, 227, 0.04);
            background-color: #ffffff;
        }
        .logo-small {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #009ee3, #00b4d8);
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 12px 14px;
            font-size: 0.95rem;
            transition: all 0.18s ease;
        }
        .form-control:focus {
            border-color: #009ee3;
            box-shadow: 0 0 0 3px rgba(0, 158, 227, 0.15);
            outline: none;
        }
        .btn-custom {
            background-color: #009ee3;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.18s ease;
        }
        .btn-custom:hover {
            background-color: #0081bb;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .link-custom {
            color: #009ee3;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .link-custom:hover {
            color: #0081bb;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container center-card">
        <div class="card w-100 shadow-sm" style="max-width: 440px;">
            <div class="card-body p-4">
                <a href="./" style="text-decoration: none; display: inline-block;">
                    <div class="logo-small">TY</div>
                </a>
                <h2 class="card-title fw-bold text-dark mb-1">Iniciar sesión</h2>
                <p class="text-muted mb-4 small">Ingresa tus credenciales para administrar tus citas y negocios.</p>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" placeholder="nombre@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                    </div>
                    <button class="btn btn-custom w-100 mb-3 shadow-sm" type="submit">Ingresar</button>
                </form>
                
                <div id="loginMessage" class="alert d-none py-2 text-center small" role="alert"></div>
                
                <div class="text-center pt-3 border-top mt-3">
                    <a href="registro" class="link-custom">Crear una cuenta nueva</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const pageBasePath = (function() {
            try {
                const pathname = window.location.pathname;
                const parts = pathname.split('/');
                const knownPages = ['pagina-inicio','client','crear-negocio','agregar-horario','login','dashboard','registro','api'];
                while (parts.length > 0) {
                    const last = parts[parts.length - 1];
                    if (last === '' || knownPages.includes(last)) {
                        parts.pop();
                    } else {
                        break;
                    }
                }
                return parts.join('/');
            } catch (e) {
                return '';
            }
        })();
        const apiUrl = pageBasePath + '/api';

        // Corrige los destinos de los enlaces absolutos dinámicamente
        if (pageBasePath) {
            const correctLinks = () => {
                document.querySelectorAll('a').forEach(el => {
                    const href = el.getAttribute('href');
                    if (href && href.startsWith('/') && !href.startsWith('//')) {
                        el.setAttribute('href', pageBasePath + (href === '/' ? '' : href));
                    }
                });
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', correctLinks);
            } else {
                correctLinks();
            }
        }

        const loginMessage = document.getElementById('loginMessage');

        function showLoginMessage(message, type = 'danger') {
            loginMessage.textContent = message;
            loginMessage.className = `alert alert-${type} py-2 text-center small`;
            loginMessage.classList.remove('d-none');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            loginMessage.classList.add('d-none');
            const formData = new FormData(e.target);
            const email = formData.get('email');
            const password = formData.get('password');

            if (!email || !password) {
                showLoginMessage('Debes completar el correo y la contraseña.');
                return;
            }

            try {
                const res = await fetch(`${apiUrl}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const result = await res.json();

                if (res.ok) {
                    localStorage.setItem('userId', result.id);
                    localStorage.setItem('userRole', result.role || 'client');
                    localStorage.setItem('userName', result.name || '');
                    showLoginMessage('Sesión iniciada correctamente. Redirigiendo...', 'success');
                    setTimeout(() => {
                        window.location.href = pageBasePath + '/pagina-inicio';
                    }, 900);
                } else {
                    showLoginMessage(result.message || 'Correo electrónico o contraseña incorrectos.');
                }
            } catch (error) {
                showLoginMessage('Error de conexión. Por favor intenta nuevamente.');
            }
        });
    </script>
</body>
</html>
