<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ingresar mi negocio - Turnos Ya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f8fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .center-card { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(0, 158, 227, 0.04);
            background-color: #ffffff;
        }
        .logo-small {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #009ee3, #00b4d8);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 158, 227, 0.15);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: all 0.18s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #009ee3;
            box-shadow: 0 0 0 3px rgba(0, 158, 227, 0.15);
            outline: none;
        }
        .btn-primary {
            background-color: #009ee3;
            border: none;
            font-weight: 600;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.18s ease;
        }
        .btn-primary:hover {
            background-color: #0081bb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.15);
        }
        .btn-outline-secondary {
            color: #475569;
            border: 1.5px solid #cbd5e1;
            font-weight: 600;
            border-radius: 8px;
            padding: 11px;
            transition: all 0.18s ease;
        }
        .btn-outline-secondary:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .step-indicator {
            font-size: 0.8rem;
            font-weight: 700;
            color: #009ee3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <div class="container center-card py-5">
        <div class="card w-100 shadow-sm" style="max-width: 540px;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="logo-small">TY</div>
                        <div>
                            <h2 class="card-title fw-bold text-dark fs-4 mb-0">Registrar mi negocio</h2>
                            <p class="text-muted mb-0 small" style="font-size: 0.8rem;">Comienza a ofrecer tus turnos en línea.</p>
                        </div>
                    </div>
                    <a href="/pagina-inicio" class="btn btn-outline-secondary btn-sm px-3">Volver</a>
                </div>

                <div id="businessMessage" class="alert d-none py-2 text-center small" role="alert"></div>

                <div id="businessStep">
                    <div class="step-indicator mb-2">Paso 1 de 2: Información Básica</div>
                    <h5 class="fw-bold mb-3 text-dark">Datos de tu negocio</h5>
                    
                    <form id="createBusinessForm">
                        <div class="mb-3">
                            <label class="form-label">Nombre del Negocio</label>
                            <input type="text" name="businessName" class="form-control" placeholder="Ej. Peluquería Bella Vista" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea name="businessDescription" class="form-control" placeholder="Describe brevemente qué servicios ofreces..." rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Dirección comercial</label>
                            <input type="text" name="businessAddress" class="form-control" placeholder="Ej. Av. de Mayo 1234, CABA">
                        </div>
                        <div class="mb-4">
                            <label class="form-label">Enlace del Logo (URL)</label>
                            <input type="url" name="businessLogoUrl" class="form-control" placeholder="Ej. https://tuservicio.com/logo.png">
                        </div>
                        <button id="nextToSchedule" class="btn btn-primary w-100 py-2 fw-bold" type="button">Siguiente: Agregar Horarios</button>
                    </form>
                </div>

                <div id="scheduleStep" class="d-none">
                    <div class="step-indicator mb-2">Paso 2 de 2: Horarios de Atención</div>
                    <h5 class="fw-bold mb-3 text-dark">Días y Horas de apertura</h5>
                    
                    <form id="scheduleForm">
                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label for="startDay" class="form-label">Día de inicio</label>
                                <select id="startDay" name="startDay" class="form-select" required>
                                    <option value="1">Lunes</option>
                                    <option value="2">Martes</option>
                                    <option value="3">Miércoles</option>
                                    <option value="4">Jueves</option>
                                    <option value="5">Viernes</option>
                                    <option value="6">Sábado</option>
                                    <option value="7">Domingo</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label for="endDay" class="form-label">Día final</label>
                                <select id="endDay" name="endDay" class="form-select" required>
                                    <option value="1">Lunes</option>
                                    <option value="2">Martes</option>
                                    <option value="3">Miércoles</option>
                                    <option value="4">Jueves</option>
                                    <option value="5">Viernes</option>
                                    <option value="6">Sábado</option>
                                    <option value="7">Domingo</option>
                                </select>
                            </div>
                        </div>
                        <div class="row g-3 mb-4">
                            <div class="col-6">
                                <label for="startTime" class="form-label">Hora inicio</label>
                                <input type="time" id="startTime" name="startTime" class="form-control" value="08:00" required>
                            </div>
                            <div class="col-6">
                                <label for="endTime" class="form-label">Hora fin</label>
                                <input type="time" id="endTime" name="endTime" class="form-control" value="14:00" required>
                            </div>
                        </div>
                        <div class="d-flex justify-content-between gap-3">
                            <button id="backToBusiness" class="btn btn-outline-secondary w-50" type="button">Volver</button>
                            <button class="btn btn-primary w-50 fw-bold" type="submit">Crear Negocio</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const pageBasePath = (function() {
                try {
                    const pathname = window.location.pathname;
                    const parts = pathname.split('/');
                    const knownPages = ['pagina-inicio','client','crear-negocio','agregar-horario','login','dashboard','registro','api'];
                    while (parts.length > 0) {
                        const last = parts[parts.length - 1];
                        if (last === '' || knownPages.includes(last)) {
                            parts.pop();
                        } else {
                            break;
                        }
                    }
                    return parts.join('/');
                } catch (e) {
                    return '';
                }
            })();

            // Cargar dinámicamente el archivo JS
            const scriptEl = document.createElement('script');
            scriptEl.src = pageBasePath + '/js/crear_negocio.js?v=' + Date.now();
            scriptEl.defer = true;
            document.body.appendChild(scriptEl);

            // Corrige los destinos de los enlaces absolutos dinámicamente
            if (pageBasePath) {
                const correctLinks = () => {
                    document.querySelectorAll('a[href^="/"]').forEach(el => {
                        const href = el.getAttribute('href');
                        if (!href.startsWith('//')) {
                            el.setAttribute('href', pageBasePath + (href === '/' ? '' : href));
                        }
                    });
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', correctLinks);
                } else {
                    correctLinks();
                }
            }

            // Fallback inline handler: asegura redireccionamiento correcto
            (function(){
                try {
                    const btn = document.getElementById('nextToSchedule');
                    const form = document.getElementById('createBusinessForm');
                    if (!btn || !form) return;
                    btn.addEventListener('click', function(ev){
                        ev.preventDefault();
                        var name = (form.elements['businessName'] || {}).value || '';
                        var description = (form.elements['businessDescription'] || {}).value || '';
                        var address = (form.elements['businessAddress'] || {}).value || '';
                        var logoUrl = (form.elements['businessLogoUrl'] || {}).value || '';
                        if (!name.trim()) {
                            var m = document.getElementById('businessMessage');
                            if (m) { m.textContent = 'El nombre del negocio es obligatorio.'; m.className = 'alert alert-danger py-2 small text-center'; m.classList.remove('d-none'); }
                            return;
                        }
                        var pending = { 
                            name: name.trim(), 
                            description: description.trim(), 
                            address: address.trim(),
                            logo_url: logoUrl.trim(),
                            owner_id: parseInt(localStorage.getItem('userId') || '0', 10) 
                        };
                        localStorage.setItem('pendingBusiness', JSON.stringify(pending));
                        window.location.href = pageBasePath + '/agregar-horario';
                    });
                } catch (e) {
                    console.error('Fallback handler error', e);
                }
            })();
        })();
    </script>
</body>
</html>
