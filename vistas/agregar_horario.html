<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agregar horario - Turnos Ya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f8fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .center-card { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(0, 158, 227, 0.04);
            background-color: #ffffff;
        }
        .logo-small {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #009ee3, #00b4d8);
            color: white;
            font-weight: 800;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 158, 227, 0.15);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .form-control, .form-select {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: all 0.18s ease;
        }
        .form-control:focus, .form-select:focus {
            border-color: #009ee3;
            box-shadow: 0 0 0 3px rgba(0, 158, 227, 0.15);
            outline: none;
        }
        .btn-primary {
            background-color: #009ee3;
            border: none;
            font-weight: 600;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.18s ease;
        }
        .btn-primary:hover {
            background-color: #0081bb;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.15);
        }
        .btn-outline-secondary {
            color: #475569;
            border: 1.5px solid #cbd5e1;
            font-weight: 600;
            border-radius: 8px;
            padding: 11px;
            transition: all 0.18s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }
        .btn-outline-secondary:hover {
            background-color: #f1f5f9;
            color: #1e293b;
            border-color: #cbd5e1;
        }
        .step-indicator {
            font-size: 0.8rem;
            font-weight: 700;
            color: #009ee3;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .business-preview {
            background-color: #e6f5fc;
            border: 1px solid #cce9f8;
            border-radius: 10px;
            padding: 14px;
            color: #0081bb;
        }
    </style>
</head>
<body>
    <div class="container center-card py-5">
        <div class="card w-100 shadow-sm" style="max-width: 640px;">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
                    <div class="d-flex align-items-center gap-3">
                        <div class="logo-small">TY</div>
                        <div>
                            <h2 class="card-title fw-bold text-dark fs-4 mb-0">Definir Disponibilidad</h2>
                            <p class="text-muted mb-0 small" style="font-size: 0.8rem;">Establece los días y horarios comerciales.</p>
                        </div>
                    </div>
                    <a href="crear-negocio" class="btn btn-outline-secondary btn-sm px-3">Volver</a>
                </div>

                <div class="step-indicator mb-2">Paso 2 de 2: Horarios de Atención</div>
                <div id="businessInfo" class="mb-4 business-preview"></div>
                <div id="scheduleMessage" class="alert d-none py-2 text-center small" role="alert"></div>

                <form id="addScheduleForm">
                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label for="startDay" class="form-label">Día de inicio</label>
                            <select id="startDay" name="startDay" class="form-select" required>
                                <option value="1">Lunes</option>
                                <option value="2">Martes</option>
                                <option value="3">Miércoles</option>
                                <option value="4">Jueves</option>
                                <option value="5">Viernes</option>
                                <option value="6">Sábado</option>
                                <option value="7">Domingo</option>
                            </select>
                        </div>
                        <div class="col-6">
                            <label for="endDay" class="form-label">Día final</label>
                            <select id="endDay" name="endDay" class="form-select" required>
                                <option value="1">Lunes</option>
                                <option value="2">Martes</option>
                                <option value="3">Miércoles</option>
                                <option value="4">Jueves</option>
                                <option value="5">Viernes</option>
                                <option value="6">Sábado</option>
                                <option value="7">Domingo</option>
                            </select>
                        </div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-6">
                            <label for="startTime" class="form-label">Hora inicio</label>
                            <input type="time" id="startTime" name="startTime" class="form-control" value="08:00" required>
                        </div>
                        <div class="col-6">
                            <label for="endTime" class="form-label">Hora fin</label>
                            <input type="time" id="endTime" name="endTime" class="form-control" value="14:00" required>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between gap-3">
                        <a href="crear-negocio" class="btn btn-outline-secondary w-50">Volver a Paso 1</a>
                        <button id="saveScheduleBtn" class="btn btn-primary w-50 fw-bold" type="button">Guardar y Publicar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const pageBasePath = (function() {
                try {
                    const pathname = window.location.pathname;
                    const parts = pathname.split('/');
                    const knownPages = ['pagina-inicio','client','crear-negocio','agregar-horario','login','dashboard','registro','api'];
                    while (parts.length > 0) {
                        const last = parts[parts.length - 1];
                        if (last === '' || knownPages.includes(last)) {
                            parts.pop();
                        } else {
                            break;
                        }
                    }
                    return parts.join('/');
                } catch (e) {
                    return '';
                }
            })();

            // Cargar dinámicamente el archivo JS
            const scriptEl = document.createElement('script');
            scriptEl.src = pageBasePath + '/js/agregar_horario.js?v=' + Date.now();
            scriptEl.defer = true;
            document.body.appendChild(scriptEl);

            // Corrige los destinos de los enlaces absolutos dinámicamente
            if (pageBasePath) {
                const correctLinks = () => {
                    document.querySelectorAll('a[href^="/"]').forEach(el => {
                        const href = el.getAttribute('href');
                        if (!href.startsWith('//')) {
                            el.setAttribute('href', pageBasePath + (href === '/' ? '' : href));
                        }
                    });
                    // También ajustar cualquier enlace relativo de 'crear-negocio' si debía ser absoluto
                    document.querySelectorAll('a[href="crear-negocio"]').forEach(el => {
                        el.setAttribute('href', pageBasePath + '/crear-negocio');
                    });
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', correctLinks);
                } else {
                    correctLinks();
                }
            }

            // Inline fallback para asegurar correcto guardado y publicación del negocio
            (function(){
                try {
                    const btn = document.getElementById('saveScheduleBtn');
                    const form = document.getElementById('addScheduleForm');
                    const info = document.getElementById('businessInfo');
                    const msg = document.getElementById('scheduleMessage');
                    if (!btn || !form) return;
                    btn.addEventListener('click', async function(ev){
                        ev.preventDefault();
                        if (btn.disabled) return;

                        if (!localStorage.getItem('pendingBusiness')) {
                            if (info) info.innerHTML = '<div class="alert alert-warning py-2 small text-center">No hay datos del negocio. Volviendo...</div>';
                            setTimeout(()=> window.location.href = pageBasePath + '/crear-negocio', 900);
                            return;
                        }
                        const pending = JSON.parse(localStorage.getItem('pendingBusiness'));
                        const startDay = parseInt((form.elements['startDay']||{}).value || '1', 10);
                        const endDay = parseInt((form.elements['endDay']||{}).value || '1', 10);
                        const startTime = (form.elements['startTime']||{}).value || '';
                        const endTime = (form.elements['endTime']||{}).value || '';
                        if (endDay < startDay) {
                            if (msg) { msg.textContent = 'El día final debe ser igual o posterior al día de inicio.'; msg.className='alert alert-danger py-2 small text-center'; msg.classList.remove('d-none'); }
                            return;
                        }
                        if (!startTime || !endTime) {
                            if (msg) { msg.textContent = 'Debes completar el horario de atención.'; msg.className='alert alert-danger py-2 small text-center'; msg.classList.remove('d-none'); }
                            return;
                        }

                        btn.disabled = true;
                        btn.innerText = 'Guardando...';

                        try {
                            const payload = {
                                name: pending.name,
                                description: pending.description,
                                address: pending.address || null,
                                logo_url: pending.logo_url || null,
                                owner_id: pending.owner_id,
                                start_day: startDay,
                                end_day: endDay,
                                start_time: startTime,
                                end_time: endTime,
                            };
                            const res = await fetch(pageBasePath + '/api/businesses-with-schedule', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
                            let result = {};
                            try { result = await res.json(); } catch(e) { console.error('Parse error', e); }
                            if (res.ok) {
                                if (msg) { msg.textContent = 'Negocio y horario guardados correctamente.'; msg.className='alert alert-success py-2 small text-center'; msg.classList.remove('d-none'); }
                                if (result && result.owner && result.owner.role) {
                                    localStorage.setItem('userRole', result.owner.role);
                                }
                                try { localStorage.setItem('pendingCreatedBusiness', JSON.stringify(result)); } catch(e){}
                                localStorage.removeItem('pendingBusiness');
                                setTimeout(()=> window.location.href = pageBasePath + '/pagina-inicio', 900);
                            } else {
                                if (msg) { msg.textContent = (result && result.message) ? result.message : 'Error guardando horario.'; msg.className='alert alert-danger py-2 small text-center'; msg.classList.remove('d-none'); }
                                btn.disabled = false;
                                btn.innerText = 'Guardar y Publicar';
                            }
                        } catch (err) {
                            console.error('Network error', err);
                            if (msg) { msg.textContent = 'Error de red. Reintenta más tarde.'; msg.className='alert alert-danger py-2 small text-center'; msg.classList.remove('d-none'); }
                            btn.disabled = false;
                            btn.innerText = 'Guardar y Publicar';
                        }
                    });
                } catch (e) { console.error('Fallback agregar_horario error', e); }
            })();
        })();
    </script>
</body>
</html>
