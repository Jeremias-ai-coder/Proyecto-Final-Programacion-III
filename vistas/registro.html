<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse - Turnos Ya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f8fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .center-card { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(0, 158, 227, 0.04);
            background-color: #ffffff;
        }
        .logo-small {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #009ee3, #00b4d8);
            color: white;
            font-weight: 800;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
            margin-bottom: 16px;
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .form-label {
            font-weight: 600;
            font-size: 0.85rem;
            color: #475569;
        }
        .form-control {
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            padding: 12px 14px;
            font-size: 0.95rem;
            transition: all 0.18s ease;
        }
        .form-control:focus {
            border-color: #009ee3;
            box-shadow: 0 0 0 3px rgba(0, 158, 227, 0.15);
            outline: none;
        }
        .btn-custom {
            background-color: #009ee3;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            padding: 12px;
            transition: all 0.18s ease;
        }
        .btn-custom:hover {
            background-color: #0081bb;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .link-custom {
            color: #009ee3;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .link-custom:hover {
            color: #0081bb;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container center-card py-5">
        <div class="card w-100 shadow-sm" style="max-width: 460px;">
            <div class="card-body p-4">
                <a href="./" style="text-decoration: none; display: inline-block;">
                    <div class="logo-small">TY</div>
                </a>
                <h2 class="card-title fw-bold text-dark mb-1">Registrarse</h2>
                <p class="text-muted mb-4 small">Crea tu cuenta de cliente en segundos. Podrás subir tu propio negocio más adelante.</p>
                
                <form id="registerForm">
                    <div class="mb-3">
                        <label class="form-label">Nombre completo</label>
                        <input type="text" name="name" class="form-control" placeholder="Juan Pérez" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Correo electrónico</label>
                        <input type="email" name="email" class="form-control" placeholder="juan@ejemplo.com" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password" name="password" class="form-control" placeholder="Mínimo 6 caracteres" required>
                    </div>
                    <button class="btn btn-custom w-100 mb-3 shadow-sm" type="submit">Crear cuenta</button>
                </form>
                
                <div id="registerMessage" class="alert d-none py-2 text-center small" role="alert"></div>
                
                <div class="text-center pt-3 border-top mt-3">
                    <a href="login" class="link-custom">Ya tengo una cuenta</a>
                </div>
            </div>
        </div>
    </div>
    <script>
        const pageBasePath = (function() {
            try {
                const pathname = window.location.pathname;
                const parts = pathname.split('/');
                const knownPages = ['pagina-inicio','client','crear-negocio','agregar-horario','login','dashboard','registro','api'];
                while (parts.length > 0) {
                    const last = parts[parts.length - 1];
                    if (last === '' || knownPages.includes(last)) {
                        parts.pop();
                    } else {
                        break;
                    }
                }
                return parts.join('/');
            } catch (e) {
                return '';
            }
        })();
        const apiUrl = pageBasePath + '/api';

        // Corrige los destinos de los enlaces absolutos dinámicamente
        if (pageBasePath) {
            const correctLinks = () => {
                document.querySelectorAll('a').forEach(el => {
                    const href = el.getAttribute('href');
                    if (href && href.startsWith('/') && !href.startsWith('//')) {
                        el.setAttribute('href', pageBasePath + (href === '/' ? '' : href));
                    }
                });
            };
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', correctLinks);
            } else {
                correctLinks();
            }
        }

        const registerMessage = document.getElementById('registerMessage');
        
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            registerMessage.classList.add('d-none');
            const data = Object.fromEntries(new FormData(e.target).entries());
            try {
                const res = await fetch(`${apiUrl}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await res.json();
                if (res.ok) {
                    registerMessage.classList.remove('d-none', 'alert-danger');
                    registerMessage.classList.add('alert-success');
                    registerMessage.innerHTML = '¡Cuenta creada correctamente! Ahora puedes ir a <a href="' + pageBasePath + '/login" class="alert-link">Iniciar sesión</a>';
                    e.target.reset();
                } else {
                    registerMessage.classList.remove('d-none');
                    registerMessage.classList.remove('alert-success');
                    registerMessage.classList.add('alert-danger');
                    registerMessage.textContent = result.message || 'No se pudo crear el usuario.';
                }
            } catch (error) {
                registerMessage.classList.remove('d-none');
                registerMessage.classList.remove('alert-success');
                registerMessage.classList.add('alert-danger');
                registerMessage.textContent = 'Error de conexión: ' + error.message;
            }
        });
    </script>
</body>
</html>
