<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienvenido - Turnos Ya</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            background-color: #f5f8fa; 
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: #1e293b;
        }
        .center-card { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .card { 
            border-radius: 16px; 
            border: 1px solid #e2e8f0;
            box-shadow: 0 12px 32px rgba(0, 158, 227, 0.04);
            background-color: #ffffff;
            transition: transform 0.2s ease-in-out;
        }
        .card:hover {
            transform: translateY(-2px);
        }
        .logo-icon {
            width: 72px;
            height: 72px;
            background: linear-gradient(135deg, #009ee3, #00b4d8);
            color: white;
            font-weight: 800;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 14px;
            margin: 0 auto 20px auto;
            box-shadow: 0 6px 20px rgba(0, 158, 227, 0.25);
        }
        .btn-custom-primary {
            background-color: #009ee3;
            color: white;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            padding: 14px;
            transition: all 0.18s ease;
        }
        .btn-custom-primary:hover {
            background-color: #0081bb;
            color: white;
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(0, 158, 227, 0.2);
        }
        .btn-custom-outline {
            background-color: transparent;
            color: #009ee3;
            border: 2px solid #009ee3;
            font-weight: 600;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.18s ease;
        }
        .btn-custom-outline:hover {
            background-color: #e6f5fc;
            color: #0081bb;
            border-color: #0081bb;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="container center-card">
        <div class="card w-100" style="max-width: 480px;">
            <div class="card-body p-5 text-center">
                <div class="logo-icon">TY</div>
                <h1 class="fw-bold fs-3 mb-2 text-dark">Turnos Ya</h1>
                <p class="text-muted mb-4 small">La solución inteligente para reservar y gestionar turnos de tus negocios favoritos al instante.</p>
                <div class="d-grid gap-3 mt-4">
                    <a href="registro" class="btn btn-custom-primary btn-lg shadow-sm">Registrarse</a>
                    <a href="login" class="btn btn-custom-outline btn-lg">Iniciar sesión</a>
                </div>
                <div class="mt-4 pt-3 border-top text-center text-muted small">
                    ¿Quieres ofrecer turnos? Crea tu cuenta como cliente y registra tu negocio en segundos.
                </div>
            </div>
        </div>
    </div>
    <script>
        // Ajusta dinámicamente los enlaces absolutos para soportar despliegues en subdirectorios de XAMPP
        (function() {
            const basePath = (function() {
                try {
                    const pathname = window.location.pathname;
                    const parts = pathname.split('/');
                    const knownPages = ['pagina-inicio','client','crear-negocio','agregar-horario','login','dashboard','registro','api'];
                    while (parts.length > 0) {
                        const last = parts[parts.length - 1];
                        if (last === '' || knownPages.includes(last)) {
                            parts.pop();
                        } else {
                            break;
                        }
                    }
                    return parts.join('/');
                } catch (e) {
                    return '';
                }
            })();
            if (basePath) {
                const correctLinks = () => {
                    document.querySelectorAll('a').forEach(el => {
                        const href = el.getAttribute('href');
                        if (href && href.startsWith('/') && !href.startsWith('//')) {
                            el.setAttribute('href', basePath + (href === '/' ? '' : href));
                        }
                    });
                };
                if (document.readyState === 'loading') {
                    document.addEventListener('DOMContentLoaded', correctLinks);
                } else {
                    correctLinks();
                }
            }
        })();
    </script>
</body>
</html>
